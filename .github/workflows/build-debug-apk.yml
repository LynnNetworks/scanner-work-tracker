name: Build Android Debug APK

on:
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            openjdk-17-jdk \
            patch \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Configure cloud endpoint
        run: |
          printf 'CLOUD_ENDPOINT_URL = "%s"\nCLOUD_FUNCTION_KEY = "%s"\nTABLET_ID = "%s"\nREAD_ACCESS_TOKEN = "%s"\n' \
            '${{ secrets.CLOUD_ENDPOINT_URL }}' \
            '${{ secrets.CLOUD_FUNCTION_KEY }}' \
            '${{ secrets.TABLET_ID }}' \
            '${{ secrets.READ_ACCESS_TOKEN || 'd4de2f6c8f2d4e3f9ac9c2e9b46f3a22' }}' > app_config.py

      - name: Build debug APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scanner-work-tracker-debug-apk
          path: bin/*.apk
