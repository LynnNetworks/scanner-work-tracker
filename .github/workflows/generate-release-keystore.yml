name: Generate Android Release Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore and passwords
        run: |
          set -euo pipefail
          mkdir -p signing-output
          STORE_PASSWORD="$(openssl rand -base64 36 | tr -d '\n')"
          KEY_PASSWORD="$(openssl rand -base64 36 | tr -d '\n')"
          KEY_ALIAS="scanner-work-tracker"

          keytool -genkeypair \
            -v \
            -keystore signing-output/scanner-work-tracker-release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Scanner Work Tracker, OU=Production, O=NSI Industries, L=Lynn, ST=MA, C=US"

          base64 -w 0 signing-output/scanner-work-tracker-release.keystore > signing-output/ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "$STORE_PASSWORD" > signing-output/ANDROID_KEYSTORE_PASSWORD.txt
          printf '%s' "$KEY_ALIAS" > signing-output/ANDROID_KEY_ALIAS.txt
          printf '%s' "$KEY_PASSWORD" > signing-output/ANDROID_KEY_PASSWORD.txt

      - name: Upload keystore material
        uses: actions/upload-artifact@v4
        with:
          name: scanner-work-tracker-release-signing-material
          path: signing-output/*
          retention-days: 1
