name: Build Android Release APK

on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            patch \
            pkg-config \
            unzip \
            zip \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Configure cloud endpoint
        run: |
          printf 'CLOUD_ENDPOINT_URL = "%s"\nCLOUD_FUNCTION_KEY = "%s"\nTABLET_ID = "%s"\nREAD_ACCESS_TOKEN = "%s"\n' \
            '${{ secrets.CLOUD_ENDPOINT_URL }}' \
            '${{ secrets.CLOUD_FUNCTION_KEY }}' \
            '${{ secrets.TABLET_ID }}' \
            '${{ secrets.READ_ACCESS_TOKEN || 'd4de2f6c8f2d4e3f9ac9c2e9b46f3a22' }}' > app_config.py

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Android release signing secrets are missing."
            echo "Required secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > signing/scanner-work-tracker-release.keystore

      - name: Build signed release APK
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/android-constraints.txt
          P4A_RELEASE_KEYSTORE: ${{ github.workspace }}/signing/scanner-work-tracker-release.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          yes | buildozer android release

      - name: Convert release bundle to universal APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          AAB="$(find bin -name '*-release.aab' -print -quit)"
          if [ -z "$AAB" ]; then
            echo "No release AAB found under bin/."
            find bin -maxdepth 2 -type f -print
            exit 1
          fi

          curl -L \
            -o bundletool.jar \
            https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar

          java -jar bundletool.jar build-apks \
            --bundle "$AAB" \
            --output scanner-work-tracker-release.apks \
            --mode universal \
            --ks signing/scanner-work-tracker-release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD"

          unzip -p scanner-work-tracker-release.apks universal.apk > bin/Scanner_Work_Tracker_v0.2.1_release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scanner-work-tracker-release-apk
          path: |
            bin/*.apk
            bin/*.aab
